services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INCIDENT_DESK_SERVICE_NAME: ${INCIDENT_DESK_SERVICE_NAME:-incident-desk}
      INCIDENT_DESK_ENVIRONMENT: ${INCIDENT_DESK_ENVIRONMENT:-development}

  db:
    image: postgres:17
    profiles: [database]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_desk}
      POSTGRES_USER: ${POSTGRES_USER:-incident_desk_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
