name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: incident_desk_test_admin
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident_desk_test_admin -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Only for this ephemeral CI service; never a deployment credential.
      TEST_DATABASE_URL: postgresql+psycopg://incident_desk_test_admin:ci_disposable_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Install Python
        run: uv python install 3.12
      - name: Install locked environment
        run: uv sync --locked
      - name: PostgreSQL migrations and integration tests
        run: uv run --locked pytest -m integration tests/integration
