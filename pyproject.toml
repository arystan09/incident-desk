[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "incident-desk"
version = "0.1.0"
description = "A synthetic incident-investigation portfolio project; foundation only."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_desk"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".bootstrap", ".tools", ".uv-cache", ".python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/incident_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-ra --import-mode=importlib -m "not integration"'
markers = ["integration: requires a dedicated real PostgreSQL test server"]
